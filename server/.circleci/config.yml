version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:20.10.0  # Changed from 18 to 20
    steps:
      - checkout
      - run:
          name: Install Server Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Client Dependencies
          command: |
            cd client
            npm install
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Verify Backend Syntax
          command: |
            cd server
            node -c index.js

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build