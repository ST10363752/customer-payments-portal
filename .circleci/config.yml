version: 2.1

jobs:
  build-and-scan:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Frontend Dependencies
          command: |
            cd client
            npm install --force
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Install SonarScanner
          command: |
            cd server
            npm install sonarqube-scanner --save-dev
      - run:
          name: Run SonarQube Scan
          command: |
            node sonar-project.js
      - run:
          name: Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build-and-scan