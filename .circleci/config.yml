version: 2.1

jobs:
  build:
    docker:
      - image: cimg/node:22.12.0  # Updated to Node 22.12
    steps:
      - checkout
      - run:
          name: Install Server Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Client Dependencies
          command: |
            cd client
            npm install --force
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Verify Backend Syntax
          command: |
            cd server
            node -c index.js
      - run:
          name: Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build