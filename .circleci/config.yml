version: 2.1

jobs:
  build-and-scan:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Frontend Dependencies
          command: |
            cd client
            npm install --force
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Install SonarScanner via npm
          command: |
            npm install -g sonar-scanner
      - run:
          name: Run SonarQube Scan
          command: |
            sonar-scanner \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.projectKey=ST10363752_customer-payments-portal \
              -Dsonar.projectName=customer-payments-portal \
              -Dsonar.sources=server \
              -Dsonar.exclusions=**/node_modules/**
      - run:
          name: Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build-and-scan