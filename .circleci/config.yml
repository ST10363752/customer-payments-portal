version: 2.1

orbs:
  node: circleci/node@5.1.0
  sonarcloud: sonarsource/sonarcloud@2.0.0

jobs:
  # Job 1: Build and test
  build-and-test:
    docker:
      - image: cimg/node:18.17.0
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Frontend Dependencies
          command: |
            cd client
            npm install
      - run:
          name: Test Backend
          command: |
            cd server
            npm test || echo "No tests configured yet"
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - persist_to_workspace:
          root: .
          paths:
            - .

  # Job 2: SonarQube Security Scan
  sonarqube-scan:
    docker:
      - image: cimg/node:18.17.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run SonarQube Scan
          command: |
            echo "SonarQube scan would run here"
            echo "Add your SonarQube token in CircleCI environment variables"
      - sonarcloud/scan:
          sonar_token_env_var: SONAR_TOKEN
          project_key: customer-payments-portal
          project_name: customer-payments-portal

  # Job 3: Security Audit
  security-audit:
    docker:
      - image: cimg/node:18.17.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Run npm audit
          command: |
            cd server
            npm audit --audit-level=moderate || echo "Vulnerabilities found"
            cd ../client
            npm audit --audit-level=moderate || echo "Vulnerabilities found"

  # Job 4: Linting
  linting:
    docker:
      - image: cimg/node:18.17.0
    steps:
      - attach_workspace:
          at: .
      - run:
          name: Install ESLint
          command: |
            cd server
            npm install eslint --save-dev || true
      - run:
          name: Run ESLint
          command: |
            cd server
            npx eslint . --ext .js || echo "Linting issues found"

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build-and-test
      - security-audit:
          requires:
            - build-and-test
      - linting:
          requires:
            - build-and-test
      - sonarqube-scan:
          requires:
            - build-and-test