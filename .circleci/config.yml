version: 2.1

jobs:
  build-and-scan:
    docker:
      - image: cimg/node:22.12.0
    steps:
      - checkout
      - run:
          name: Install Backend Dependencies
          command: |
            cd server
            npm install
      - run:
          name: Install Frontend Dependencies
          command: |
            cd client
            npm install --force
      - run:
          name: Build Frontend
          command: |
            cd client
            npm run build
      - run:
          name: Download SonarScanner CLI
          command: |
            wget https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-6.2.1.4610-linux.zip
            unzip sonar-scanner-cli-6.2.1.4610-linux.zip
            export PATH=$PATH:$PWD/sonar-scanner-6.2.1.4610-linux/bin
      - run:
          name: Run SonarQube Scan
          command: |
            export PATH=$PATH:$PWD/sonar-scanner-6.2.1.4610-linux/bin
            sonar-scanner \
              -Dsonar.host.url=https://sonarcloud.io \
              -Dsonar.login=$SONAR_TOKEN \
              -Dsonar.projectKey=ST10363752_customer-payments-portal \
              -Dsonar.projectName=customer-payments-portal \
              -Dsonar.sources=server \
              -Dsonar.exclusions=**/node_modules/**
      - run:
          name: Security Audit
          command: |
            cd server
            npm audit --audit-level=moderate || true

workflows:
  version: 2
  build-and-scan:
    jobs:
      - build-and-scan